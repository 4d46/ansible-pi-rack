---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - gpg
      - curl
      - ca-certificates
      - python3-debian  # needed by deb822_repository
    state: present
  register: docker_prereqs

- name: Create directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# The key is downloaded to a private temp file and its fingerprint checked
# before it reaches /etc/apt/keyrings, so apt never trusts an unverified key.
# The fetch/inspect steps only touch the temp file, so they also run in check
# mode, letting --check report accurately whether the installed key would change.
- name: Install verified Docker GPG key
  block:
    - name: Create temp file for Docker GPG key
      ansible.builtin.tempfile:
        state: file
        suffix: .asc
      register: docker_gpg_tmp
      check_mode: false
      changed_when: false

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: "{{ docker_gpg_tmp.path }}"
        mode: '0600'
        force: true
      check_mode: false
      changed_when: false

    - name: Read Docker GPG key fingerprint
      ansible.builtin.command:
        argv: [gpg, --show-keys, --with-colons, "{{ docker_gpg_tmp.path }}"]
      register: docker_gpg_show
      check_mode: false
      changed_when: false

    # In --with-colons output the first fpr record is the primary key's
    # fingerprint, in field 10.
    - name: Verify Docker GPG key fingerprint
      ansible.builtin.assert:
        that: docker_gpg_actual == docker_gpg_fingerprint | replace(' ', '') | upper
        fail_msg: >-
          Docker GPG key fingerprint {{ docker_gpg_actual }} does not match the
          pinned {{ docker_gpg_fingerprint }}. Verify the new key independently (see
          roles/docker/defaults/main.yml) before updating docker_gpg_fingerprint.
        quiet: true
      vars:
        docker_gpg_actual: >-
          {{ (docker_gpg_show.stdout_lines | select('match', '^fpr:') | first).split(':')[9] }}

    - name: Install Docker GPG key
      ansible.builtin.copy:
        src: "{{ docker_gpg_tmp.path }}"
        remote_src: true
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: '0644'

  always:
    - name: Remove temp Docker GPG key
      ansible.builtin.file:
        path: "{{ docker_gpg_tmp.path }}"
        state: absent
      check_mode: false
      changed_when: false
      when: docker_gpg_tmp.path is defined

# deb822 format (/etc/apt/sources.list.d/docker.sources), Debian's default since
# trixie. Signed-By ties this repository to Docker's key alone. A dry run before
# python3-debian is installed can't load the module, so it skips this once.
- name: Add Docker repository to Apt sources
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ (ansible_facts['architecture'] == 'aarch64') | ternary('arm64', 'amd64') }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  when: not (ansible_check_mode and docker_prereqs is changed)

# Written by apt_repository before the switch; leaving it would list the
# repository twice and make apt warn on every update.
- name: Remove legacy one-line Docker source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Install Docker and related packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Add admin user to docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

- name: Configure Docker daemon (log rotation)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    owner: root
    group: root
    mode: '0644'
  notify: Restart docker

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

---
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install essential system utilities
  ansible.builtin.apt:
    name:
      - lshw
      - htop
      - vim
      - curl
      - wget
      - git
      - tree
    state: present

- name: Check for cmdline.txt location
  ansible.builtin.stat:
    path: /boot/firmware/cmdline.txt
  register: common_cmdline_firmware

- name: Set cmdline path fact
  ansible.builtin.set_fact:
    common_cmdline_file: "{{ common_cmdline_firmware.stat.exists | ternary('/boot/firmware/cmdline.txt', '/boot/cmdline.txt') }}"

- name: Enable cgroups for K3s
  ansible.builtin.lineinfile:
    path: "{{ common_cmdline_file }}"
    backrefs: true
    regexp: '^((?!.*cgroup_enable=cpuset).*)$'
    line: '\1 cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1'
    state: present
  notify: Reboot system

- name: Check for config.txt location
  ansible.builtin.stat:
    path: /boot/firmware/config.txt
  register: common_config_firmware

- name: Set config.txt path fact
  ansible.builtin.set_fact:
    common_config_file: "{{ common_config_firmware.stat.exists | ternary('/boot/firmware/config.txt', '/boot/config.txt') }}"

# Disabling Wi-Fi on a host we reach over Wi-Fi would strand it until the SD card is edited by hand.
- name: Refuse to disable Wi-Fi on a host whose default route uses it
  ansible.builtin.assert:
    that: not (ansible_facts['default_ipv4']['interface'] | default('') is match('wl'))
    fail_msg: >-
      {{ inventory_hostname }} routes via {{ ansible_facts['default_ipv4']['interface'] }};
      set wifi_enabled=true for this host or move it to Ethernet first.
    quiet: true
  when: not wifi_enabled | bool

# Device-tree overlays stop the firmware bringing the radios up at all, so the
# kernel never creates hci0/wlan0. The explicit [all] header ensures the block
# applies to every board regardless of which conditional section precedes it.
- name: Disable unused onboard radios at boot
  ansible.builtin.blockinfile:
    path: "{{ common_config_file }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: onboard radios"
    block: "{{ (['[all]'] + common_radio_overlays) | join('\n') }}"
    state: "{{ (common_radio_overlays | length > 0) | ternary('present', 'absent') }}"
    backup: true
  vars:
    common_radio_overlays: >-
      {{ ([] if bluetooth_enabled | bool else ['dtoverlay=disable-bt'])
         + ([] if wifi_enabled | bool else ['dtoverlay=disable-wifi']) }}
  notify: Reboot system

- name: Gather service facts
  ansible.builtin.service_facts:

# When re-enabling, the services only start cleanly after the reboot removes
# the overlay, so leave their run state alone and just enable them for boot.
- name: Set Bluetooth services state
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{{ bluetooth_enabled | bool }}"
    state: "{{ omit if bluetooth_enabled | bool else 'stopped' }}"
  loop:
    - hciuart.service
    - bluetooth.service
  when: item in ansible_facts.services

- name: Ensure admin group exists
  ansible.builtin.group:
    name: "{{ admin_user }}"
    state: present

- name: Ensure admin user exists with sudo privileges
  ansible.builtin.user:
    name: "{{ admin_user }}"
    group: "{{ admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    password: "{{ admin_password | password_hash('sha512') }}"
    update_password: on_create
    state: present

- name: Ensure admin passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Deploy admin SSH public key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_key }}"
    state: present
    exclusive: true
  register: common_ssh_key_result
  no_log: true

- name: Harden SSH — disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
    validate: /usr/sbin/sshd -t -f %s
  when:
    - common_ssh_key_result is succeeded
    - ssh_enforce_hardening | bool
  notify: Restart sshd

- name: Harden SSH — disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
    validate: /usr/sbin/sshd -t -f %s
  when:
    - common_ssh_key_result is succeeded
    - ssh_enforce_hardening | bool
  notify: Restart sshd

- name: Ensure systemd-timesyncd is active
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

name: Ansible Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lint only reads the repo; the token gets no write access.
permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: pip install -r requirements.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        run: ansible-lint site.yml

      # shellcheck and jq are preinstalled on GitHub's Ubuntu runners.
      - name: ShellCheck scripts
        run: shellcheck scripts/upgrades scripts/tests/test_upgrades.sh scripts/collectors/*.sh

      - name: Test scripts
        run: scripts/tests/test_upgrades.sh

---
# Vault variables are proxied here so templates use clean names.
# Secret values live only in vault.yml.tpl / 1Password — never here.
admin_user: admin
admin_password: "{{ vault_admin_password }}"
admin_ssh_key: "{{ vault_admin_ssh_key }}"

# Grafana PDC Agent
grafana_pdc_token: "{{ vault_grafana_pdc_token }}"
grafana_pdc_cluster: "{{ vault_grafana_pdc_cluster }}"
grafana_pdc_hosted_grafana_id: "{{ vault_grafana_pdc_hosted_grafana_id }}"

# Network
rack_subnet: "{{ vault_rack_subnet }}"

# Tailscale
tailscale_authkey: "{{ vault_tailscale_authkey }}"
tailscale_hostname: "{{ inventory_hostname }}"
tailscale_routes: "{{ rack_subnet }}"
tailscale_extra_args: "--advertise-exit-node"

# Safety toggle: Only harden SSH once we know we can log in with a key.
# This is disabled automatically during 'make deploy-bootstrap'.
ssh_enforce_hardening: true

# Onboard radios: the rack is wired, so keep the attack surface down. Flipping
# either back to true and re-running the playbook restores it (with a reboot).
# Override per host in inventory.yml if one Pi needs a radio (see README).
bluetooth_enabled: false
wifi_enabled: false

# TLS / certbot
certbot_secrets_dir: /root/.secrets/certbot
certbot_gandi_ini: "{{ certbot_secrets_dir }}/gandi.ini"
tls_hostname_fqdn: "{{ vault_tls_hostname_fqdn }}"
tls_acme_email: "{{ vault_le_email }}"
certbot_cert_dir: "/etc/letsencrypt/live/{{ tls_hostname_fqdn }}"

# Container image tags
# Every image is pinned here so git records exactly what runs on the rack.
# Pins are "tag@sha256:digest": the tag is for humans, the digest is what Docker
# enforces, so a tag re-pointed upstream can't change what gets pulled. Use the
# multi-arch index digest (what the registry serves for the tag) so it resolves
# on arm64; Renovate keeps both parts current once a digest is present.
# Renovate reads the "# renovate:" comment above each tag and opens a PR when
# upstream publishes a newer one; merging and deploying is what upgrades the
# container. Never use :latest - compose only pulls missing images, so it
# freezes at whatever was first pulled with no record of which version that is.

# renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant
ha_image_tag: "2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e"

# renovate: datasource=docker depName=docker.elastic.co/elasticsearch/elasticsearch
es_image_tag: "9.5.6@sha256:79b4f1de4c15e6eca824723086a51e5934406d614d410cc11be77748cafac537"

# renovate: datasource=docker depName=grafana/pdc-agent
grafana_pdc_image_tag: "0.0.68@sha256:f2c3b93bd1881b5f8fb9f6bf3d7e6d1dedeaf213a567172f278082e735a63c99"

# renovate: datasource=docker depName=tailscale/tailscale
tailscale_image_tag: "v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c"
